name: VVK Radar Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, v8-parser]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Compile Python
        run: python -m py_compile src/build_calendar.py tests/test_sources.py
      - name: Run regression tests
        run: python -m pytest -q tests/test_sources.py
