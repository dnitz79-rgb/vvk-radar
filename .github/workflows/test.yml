name: VVK Radar Tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, v8-parser, source-date-fixes]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vvk-radar-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test runner
        run: python -m pip install --upgrade pytest

      - name: Compile Python
        run: python -m py_compile src/build_calendar.py tests/test_sources.py

      - name: Run regression tests
        run: python -m pytest -q tests/test_sources.py
