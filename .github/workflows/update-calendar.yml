name: Update VVK Radar

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Apple calendar
        run: python src/build_calendar.py
      - name: Commit calendar
        run: |
          git config user.name "VVK Radar"
          git config user.email "actions@users.noreply.github.com"
          git add public/vvk-radar.ics
          git diff --cached --quiet || git commit -m "Update VVK calendar"
          git push
